<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0E1530">
  <title>Pawnfare</title>
  <link rel="preload" href="fonts/spectral-600-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="stage"></canvas>

  <header id="hud" class="hud" hidden>
    <button id="pauseBtn" class="icon-btn" type="button"></button>
    <div id="pips" class="pips"></div>
    <div id="moves" class="moves">
      <span id="movesNum" class="moves-num">0</span>
      <span id="movesTrack" class="track"></span>
    </div>
  </header>

  <footer id="tray" class="tray" hidden>
    <div id="fallen" class="fallen"></div>
    <div id="trayAction" class="tray-action"></div>
  </footer>

  <main id="screen" class="screen"></main>

  <div id="sheetWrap" class="sheet-wrap" hidden>
    <section id="sheet" class="sheet" role="dialog" aria-modal="true"></section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="game-sdk.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/pieces.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/solver.js"></script>
  <script src="js/eras.js"></script>
  <script src="js/gen.js"></script>
  <script src="js/codec.js"></script>
  <script src="js/starters.js"></script>
  <script src="js/daily-table.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/draft.js"></script>
  <script src="js/run.js"></script>
  <script src="js/save.js"></script>
  <script src="js/share.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/art.js"></script>
  <script src="js/board.js"></script>
  <script src="js/genclient.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
