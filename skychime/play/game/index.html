<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0B1226">
  <title>Skychime</title>
  <link rel="preload" href="fonts/archivo-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sky" aria-label="Night sky"></canvas>

  <button id="pauseBtn" class="icon-btn hud-pause" type="button" hidden data-aria="pause">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1.2"/><rect x="13.9" y="5" width="3.6" height="14" rx="1.2"/></svg>
  </button>

  <section id="begin" class="screen begin" hidden>
    <h1 class="wordmark" data-t="title"></h1>
    <div class="begin-ring" aria-hidden="true"><span></span></div>
    <p class="begin-text" data-t="tapToBegin"></p>
  </section>

  <section id="menu" class="screen menu" hidden>
    <header class="topbar">
      <button id="dailyBtn" class="chip" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5.5" width="16" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="15" r="1.8"/></svg>
        <span id="dailyLabel"></span>
        <span id="dailyStreak" class="chip-sub"></span>
      </button>
      <span class="grow"></span>
      <button id="soundBtn" class="icon-btn" type="button">
        <svg class="snd-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <svg class="snd-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"/><path d="M15.5 9.5l5 5M20.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" type="button" data-aria="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="9" cy="7" r="2.2"/><circle cx="15" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </header>

    <div class="menu-title">
      <h1 class="wordmark" data-t="title"></h1>
      <p id="bestLine" class="best-line"></p>
      <button id="postcardBtn" class="chip postcard-chip" type="button" hidden data-aria="postcardOpen">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M6 16l4-4 3 3 2-2 3 3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="15.5" cy="9.5" r="1.4"/></svg>
        <span id="postcardLen"></span>
      </button>
    </div>

    <div class="menu-actions">
      <div id="skylines" class="skylines" role="list"></div>
      <p id="skylineNote" class="note" hidden></p>
      <button id="previewBtn" class="secondary" type="button" hidden></button>
      <button id="riverBuyBtn" class="secondary" type="button" hidden></button>
      <button id="playBtn" class="primary big" type="button" data-t="play"></button>
      <div id="goals" class="goals"></div>
    </div>
  </section>

  <div id="scrim" class="scrim" hidden></div>

  <section id="pause" class="sheet small" hidden role="dialog" aria-modal="true">
    <h2 data-t="paused"></h2>
    <div class="stack">
      <button id="resumeBtn" class="primary big" type="button" data-t="resume"></button>
      <button id="pauseSoundBtn" class="secondary" type="button"></button>
      <button id="endShowBtn" class="ghost" type="button" data-t="endShow"></button>
    </div>
  </section>

  <section id="encore" class="sheet small" hidden role="dialog" aria-modal="true">
    <div class="dark-city" aria-hidden="true"></div>
    <h2 data-t="lightsOut"></h2>
    <div class="stack">
      <button id="encoreBtn" class="primary big" type="button" hidden></button>
      <button id="encoreEndBtn" class="ghost" type="button" data-t="endShow"></button>
    </div>
  </section>

  <section id="results" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-scroll">
      <p id="resKicker" class="kicker"></p>
      <p id="resScore" class="score-big"></p>
      <p id="resBest" class="best-line"></p>
      <ul id="resStats" class="stats"></ul>
      <figure class="postcard">
        <canvas id="resCard" width="640" height="480"></canvas>
        <figcaption id="resCardCap"></figcaption>
      </figure>
      <ul id="resNotes" class="notes"></ul>
      <div id="resOffer" class="offer" hidden>
        <p class="offer-title" data-t="removeAds"></p>
        <p class="offer-text" data-t="removeAdsDesc"></p>
        <div class="row">
          <button id="offerBuyBtn" class="secondary" type="button"></button>
          <button id="offerNoBtn" class="ghost" type="button" data-t="notNow"></button>
        </div>
      </div>
    </div>
    <div class="sheet-actions">
      <button id="nextBtn" class="primary big" type="button" data-t="nextShow"></button>
      <button id="secondBtn" class="primary big" type="button" hidden></button>
      <div class="row">
        <button id="againBtn" class="secondary" type="button" data-t="again"></button>
        <button id="shareBtn" class="secondary" type="button" hidden data-t="share"></button>
        <button id="resMenuBtn" class="secondary" type="button" data-t="menu"></button>
      </div>
    </div>
  </section>

  <section id="daily" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-scroll">
      <div class="sheet-head">
        <h2 id="dailyTitle"></h2>
        <button id="dailyClose" class="icon-btn" type="button" data-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="dailyStreakLine" class="best-line"></p>
      <div id="calendar" class="calendar" role="img"></div>
      <p id="dailyScore" class="score-mid" hidden></p>
      <figure class="postcard" id="dailyCardWrap" hidden>
        <canvas id="dailyCard" width="640" height="480"></canvas>
      </figure>
      <p id="dailyNote" class="note"></p>
    </div>
    <div class="sheet-actions">
      <button id="dailyPlayBtn" class="primary big" type="button" data-t="dailyPlay"></button>
      <button id="dailySecondBtn" class="primary big" type="button" hidden></button>
      <button id="dailyShareBtn" class="secondary" type="button" hidden data-t="share"></button>
    </div>
  </section>

  <section id="settings" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-scroll">
      <div class="sheet-head">
        <h2 data-t="settings"></h2>
        <button id="settingsClose" class="icon-btn" type="button" data-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <div class="rows">
        <button class="setting" id="setSound" type="button"><span data-t="sound"></span><b></b></button>
        <button class="setting" id="setHaptics" type="button"><span data-t="vibration"></span><b></b></button>
        <button class="setting" id="setFlash" type="button"><span data-t="reducedFlash"></span><b></b></button>
        <button class="setting" id="setMotion" type="button"><span data-t="reducedMotion"></span><b></b></button>
        <button class="setting" id="setHowTo" type="button"><span data-t="howToPlay"></span><b>&#8250;</b></button>
      </div>
      <div id="adsBlock" class="rows" hidden>
        <p id="adFreeLine" class="note" hidden data-t="adFreeThanks"></p>
        <button class="setting" id="buyBtn" type="button"><span id="buyLabel"></span><b>&#8250;</b></button>
        <p id="buyDesc" class="note" data-t="removeAdsDesc"></p>
        <button class="setting" id="restoreBtn" type="button"><span data-t="restore"></span><b>&#8250;</b></button>
      </div>
      <div class="rows">
        <button class="setting" id="privacyBtn" type="button" hidden><span data-t="privacyOptions"></span><b>&#8250;</b></button>
        <a class="setting" id="policyLink" href="https://apps.mohdshayan.com/privacy-policies/skychime-privacy-policy.html" target="_blank" rel="noopener"><span data-t="privacyPolicy"></span><b>&#8599;</b></a>
      </div>
    </div>
  </section>

  <section id="postcard" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-scroll">
      <div class="sheet-head">
        <h2 id="postcardTitle"></h2>
        <button id="postcardClose" class="icon-btn" type="button" data-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <figure class="postcard">
        <canvas id="pcCard" width="640" height="480"></canvas>
        <figcaption id="pcCaption"></figcaption>
      </figure>
    </div>
  </section>

  <section id="howto" class="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-scroll">
      <div class="sheet-head">
        <h2 data-t="howToPlay"></h2>
        <button id="howtoClose" class="icon-btn" type="button" data-aria="close">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
        </button>
      </div>
      <p id="howtoText" class="prose"></p>
      <ul id="howtoTips" class="tips"></ul>
    </div>
  </section>

  <p id="toast" class="toast" role="status" aria-live="polite" hidden></p>

  <script src="game-sdk.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/model.js"></script>
  <script src="js/skylines.js"></script>
  <script src="js/volleys.js"></script>
  <script src="js/show.js"></script>
  <script src="js/save.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/daily.js"></script>
  <script src="js/flash.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/render.js"></script>
  <script src="js/pace.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
