<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Umbra</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" hidden>

  <header id="topbar">
    <button class="placebtn" id="placeBtn">
      <b id="placeName">Home</b>
      <i id="placeSub">Bortle 6</i>
    </button>
    <div class="topacts">
      <button class="iconbtn" id="redBtn" aria-label="Red light mode">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><path d="M12 3.8a8.2 8.2 0 0 0 0 16.4z" fill="currentColor" stroke="none"/></svg>
      </button>
      <button class="iconbtn" id="setBtn" aria-label="Settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/><circle cx="9" cy="7" r="2.2"/><circle cx="15.5" cy="12" r="2.2"/><circle cx="8" cy="17" r="2.2"/></svg>
      </button>
    </div>
  </header>

  <main id="stage">
    <section class="view" id="v-tonight"><div class="pad" id="tonightBody"></div></section>
    <section class="view" id="v-events" hidden>
      <div class="filterbar" id="eventFilters"></div>
      <div class="pad" id="eventsBody"></div>
    </section>
    <section class="view" id="v-places" hidden><div class="pad" id="placesBody"></div></section>
    <section class="view" id="v-log" hidden><div class="pad" id="logBody"></div></section>
  </main>

  <nav id="tabs">
    <button class="tab is-on" data-view="tonight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.6A8.5 8.5 0 0 1 9.4 3.5a8.5 8.5 0 1 0 11.1 11.1z"/></svg><span>Tonight</span>
    </button>
    <button class="tab" data-view="events">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg><span>Events</span>
    </button>
    <button class="tab" data-view="places">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.5s7-6.3 7-11.3a7 7 0 1 0-14 0c0 5 7 11.3 7 11.3z"/><circle cx="12" cy="10" r="2.6"/></svg><span>Places</span>
    </button>
    <button class="tab" data-view="log">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4.5h11.5a2.5 2.5 0 0 1 2.5 2.5v13H7.5A2.5 2.5 0 0 1 5 17.5z"/><path d="M9 9h6M9 13h6"/></svg><span>Log</span>
    </button>
  </nav>
</div>

<!-- a full screen page used for event details, settings and the method notes -->
<section class="page" id="page" hidden>
  <header class="pagebar">
    <button class="iconbtn" id="pageBack" aria-label="Back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4.5 7 12l8 7.5"/></svg>
    </button>
    <b id="pageTitle"></b>
  </header>
  <div class="pagescroll"><div class="pad" id="pageBody"></div></div>
</section>

<!-- onboarding -->
<section class="page" id="onboard" hidden>
  <div class="pagescroll"><div class="pad" id="onboardBody"></div></div>
</section>

<!-- one generic bottom sheet, reused -->
<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel">
    <div class="sheet-head"><b id="sheetTitle"></b>
      <button class="iconbtn" id="sheetClose" aria-label="Close">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</div>

<p id="toast" class="toast" hidden></p>

<script src="js/astro.js"></script>
<script src="js/data.js"></script>
<script src="js/sky.js"></script>
<script src="js/store.js"></script>
<script src="js/draw.js"></script>
<script src="js/art.js"></script>
<script src="js/notify.js"></script>
<script src="js/app.js"></script>
</body>
</html>
