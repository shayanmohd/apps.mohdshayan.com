<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Fogcarver</title>
  <link rel="preload" href="fonts/fog-serif.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="style.css">
</head>
<body data-screen="home">
  <canvas id="c" data-aria="aria.board" role="img"></canvas>

  <div id="intro" class="intro" aria-hidden="true"><span data-t="title"></span></div>

  <!-- play: icons and numbers only -->
  <div id="hud" class="hud" hidden>
    <button id="pauseBtn" class="icon-btn" data-aria="aria.pause">
      <svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    </button>
    <div class="scorebox">
      <span id="hudScore" class="score">0</span>
      <span id="hudPennant" class="pennant"><svg viewBox="0 0 24 24"><path d="M6 21V3l12 4-12 4"/></svg></span>
      <span id="hudPar" class="par">0</span>
    </div>
    <div class="left" data-aria="tilesLeft" role="img">
      <svg viewBox="0 0 24 24"><path d="M12 3l7 4v6l-7 4-7-4V7z M5 16l7 4 7-4"/></svg>
      <span id="hudLeft">0</span>
    </div>
  </div>
  <button id="undoBtn" class="icon-btn undo" data-aria="aria.undo" hidden>
    <svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
  </button>

  <!-- home -->
  <section id="home" class="screen">
    <header class="top">
      <h1 class="wordmark" data-t="title"></h1>
      <button id="settingsBtn" class="icon-btn" data-aria="aria.settings">
        <svg viewBox="0 0 24 24"><path d="M18.83 10.47 L21.52 10.76 L21.52 13.24 L18.83 13.53 L17.91 15.75 L19.61 17.85 L17.85 19.61 L15.75 17.91 L13.53 18.83 L13.24 21.52 L10.76 21.52 L10.47 18.83 L8.25 17.91 L6.15 19.61 L4.39 17.85 L6.09 15.75 L5.17 13.53 L2.48 13.24 L2.48 10.76 L5.17 10.47 L6.09 8.25 L4.39 6.15 L6.15 4.39 L8.25 6.09 L10.47 5.17 L10.76 2.48 L13.24 2.48 L13.53 5.17 L15.75 6.09 L17.85 4.39 L19.61 6.15 L17.91 8.25 Z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </header>
    <div class="dayline"><span id="homeDay" class="dayname"></span><span id="homeStreak" class="streak"></span></div>
    <div id="homeMap" class="mapslot"></div>
    <div class="actions">
      <p id="homeDone" class="scoreline" hidden></p>
      <button id="playBtn" class="primary"></button>
      <button id="repairBtn" class="reward" hidden></button>
      <button id="continueBtn" class="secondary" hidden></button>
      <div class="row">
        <button id="atlasBtn" class="secondary"><svg viewBox="0 0 24 24"><path d="M12 6c-2-1.6-5-2-8-1.6V19c3-.4 6 0 8 1.6 2-1.6 5-2 8-1.6V4.4c-3-.4-6 0-8 1.6zM12 6v14.6"/></svg><span data-t="atlas"></span></button>
        <button id="archiveBtn" class="secondary"><svg viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="1.5"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></svg><span data-t="archive"></span></button>
      </div>
    </div>
  </section>

  <!-- result -->
  <section id="result" class="screen" hidden>
    <header class="top">
      <div>
        <h2 id="resultTitle" class="title"></h2>
        <p id="resultSub" class="sub"></p>
      </div>
      <div id="resultStars" class="stars" role="img"></div>
    </header>
    <div id="resultMap" class="mapslot framed"></div>
    <div class="card">
      <p id="resultScore" class="scoreline"></p>
      <div class="breakdown">
        <span data-aria="aria.seams" role="img"><svg viewBox="0 0 24 24"><path d="M4 12h16M8 8v8M12 8v8M16 8v8"/></svg><b id="bdSeams">0</b></span>
        <span data-aria="aria.closures" role="img"><svg viewBox="0 0 24 24"><circle cx="9" cy="10" r="4"/><circle cx="15.5" cy="11" r="3.4"/><path d="M9 14v6M15.5 14.4V20"/></svg><b id="bdClosures">0</b></span>
        <span id="bdRiverWrap" data-aria="aria.river" role="img"><svg viewBox="0 0 24 24"><path d="M3 9c3-2 6 2 9 0s6-2 9 0M3 15c3-2 6 2 9 0s6-2 9 0"/></svg><b id="bdRiver">0</b></span>
      </div>
      <div class="buttons">
        <button id="nextBtn" class="primary" data-t="next" hidden></button>
        <button id="todayBtn" class="secondary" data-t="playToday" hidden></button>
        <button id="shareBtn" class="primary" hidden><svg viewBox="0 0 24 24"><path d="M12 15V3M7.5 7.5L12 3l4.5 4.5M5 12v7.5h14V12"/></svg><span data-t="share"></span></button>
        <button id="secondBtn" class="reward" hidden></button>
        <div class="row">
          <button id="againBtn" class="secondary" data-t="playAgain" hidden></button>
          <button id="archiveBackBtn" class="secondary" data-t="archive" hidden></button>
          <button id="resultAtlas" class="secondary" data-t="atlas" hidden></button>
          <button id="resultHome" class="secondary" data-t="home"></button>
        </div>
      </div>
      <div id="offerBox" class="offer" hidden>
        <p data-t="removeAdsWhat"></p>
        <button id="offerBuyBtn" class="secondary"></button>
        <button id="offerNotNow" class="quiet" data-t="notNow"></button>
      </div>
    </div>
  </section>

  <!-- Atlas -->
  <section id="atlas" class="screen paper" hidden>
    <header class="top">
      <button id="atlasHome" class="icon-btn" data-aria="home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="title" data-t="atlas"></h2>
      <span class="spacer"></span>
    </header>
    <button id="atlasContinue" class="primary wide" hidden></button>
    <div id="atlasList" class="scroll"></div>
  </section>

  <!-- Archive -->
  <section id="archive" class="screen paper" hidden>
    <header class="top">
      <button id="archiveHome" class="icon-btn" data-aria="home"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h2 class="title" data-t="archive"></h2>
      <span class="spacer"></span>
    </header>
    <p id="archiveLeft" class="note" hidden></p>
    <p id="archiveWeb" class="note" hidden><span data-t="archiveWeb"></span> <a id="aboutLink" href="#" target="_blank" rel="noopener" data-t="aboutLink"></a></p>
    <div id="archiveList" class="scroll"></div>
  </section>

  <!-- sheets -->
  <div id="sheet" class="sheet" hidden>
    <div id="settingsPanel" class="panel" role="dialog" aria-modal="true" hidden>
      <h2 data-t="settings"></h2>
      <button id="soundToggle" class="list-row" aria-pressed="true"><span data-t="sound"></span><span id="soundState" class="state"></span></button>
      <button id="motionToggle" class="list-row" aria-pressed="false"><span data-t="reduceMotion"></span><span id="motionState" class="state"></span></button>
      <p id="buyWhat" class="what" data-t="removeAdsWhat" hidden></p>
      <button id="buyBtn" class="list-row strong" hidden></button>
      <button id="restoreBtn" class="list-row" data-t="restore" hidden></button>
      <p id="adFreeLine" class="what" data-t="adFreeThanks" hidden></p>
      <button id="privacyBtn" class="list-row" data-t="privacyOptions" hidden></button>
      <a id="policyLink" class="list-row" href="#" target="_blank" rel="noopener" data-t="privacyPolicy"></a>
      <button id="tutorialBtn" class="list-row" data-t="tutorialAgain"></button>
      <button id="settingsClose" class="primary" data-t="close"></button>
    </div>
    <div id="pausePanel" class="panel" role="dialog" aria-modal="true" hidden>
      <h2 data-t="paused"></h2>
      <button id="resumeBtn" class="primary" data-t="resume"></button>
      <button id="pauseSound" class="list-row" aria-pressed="true"><span data-t="sound"></span><span id="pauseSoundState" class="state"></span></button>
      <button id="pauseHome" class="secondary" data-t="home"></button>
    </div>
    <div id="unlockPanel" class="panel" role="dialog" aria-modal="true" hidden>
      <h2 id="unlockTitle"></h2>
      <p id="unlockNote" class="what"></p>
      <button id="unlockBtn" class="reward" hidden></button>
      <a id="unlockAbout" class="list-row" href="https://apps.mohdshayan.com/fogcarver/" target="_blank" rel="noopener" data-t="aboutLink" hidden></a>
      <button id="unlockClose" class="secondary" data-t="close"></button>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <template id="icon-pennant"><svg class="ico" viewBox="0 0 24 24"><path d="M6 21V3l12 4-12 4"/></svg></template>
  <template id="icon-pennantOn"><svg class="ico on" viewBox="0 0 24 24"><path d="M6 21V3l12 4-12 4"/></svg></template>
  <template id="icon-laurel"><svg class="ico" viewBox="0 0 24 24"><path d="M8.5 13.5L6 22l3.2-1.6L11 23l1-6M15.5 13.5L18 22l-3.2-1.6L13 23l-1-6"/><circle cx="12" cy="9" r="6"/></svg></template>
  <template id="icon-laurelOn"><svg class="ico on" viewBox="0 0 24 24"><path d="M8.5 13.5L6 22l3.2-1.6L11 23l1-6M15.5 13.5L18 22l-3.2-1.6L13 23l-1-6"/><circle cx="12" cy="9" r="6"/></svg></template>
  <template id="icon-star"><svg class="ico star" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/></svg></template>
  <template id="icon-starOn"><svg class="ico star on" viewBox="0 0 24 24"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6L3.4 9.3l6-.7z"/></svg></template>

  <script src="game-sdk.js"></script>
  <script src="js/strings.js"></script>
  <script src="js/rng.js"></script>
  <script src="js/hex.js"></script>
  <script src="js/rules.js"></script>
  <script src="js/islands.js"></script>
  <script src="js/daily-table.js"></script>
  <script src="js/atlas-table.js"></script>
  <script src="js/progress.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/share.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
